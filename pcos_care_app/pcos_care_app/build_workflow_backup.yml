name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project files
        run: |
          cp -r lib /tmp/lib_backup
          flutter create --platforms=android --project-name pcos_care --org com.pcoscare .
          rm -rf lib test
          cp -r /tmp/lib_backup lib
          sed -i 's/android:label="[^"]*"/android:label="PCOS CARE"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pcos-care-apk
          path: build/app/outputs/flutter-apk/app-release.apk
